name: Deploy to Pi

# Runs on a self-hosted runner registered on the Pi itself (see README/
# pi-setup notes for registration steps) - the runner polls GitHub, so this
# works from behind a home router with no port forwarding or public IP.
#
# Secrets/tokens are intentionally NOT in this repo - they're expected to
# already exist on the Pi at ~/secrets/dashboarded/ (copied there once via
# scp, outside any git checkout) and get copied into the build directory
# each run.

on:
  push:
    branches: [main]
    # Changes here alone don't need a rebuild - README/setup docs and Pi
    # OS-level kiosk config aren't part of the Docker image.
    paths-ignore:
      - "README.md"
      - "MIGRATION_PLAN.md"
      - "pi-setup/**"

jobs:
  deploy:
    runs-on: self-hosted
    # Manual escape hatch for anything paths-ignore doesn't catch: include
    # "[skip deploy]" anywhere in the commit message.
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy secrets into place
        run: |
          cp ~/secrets/dashboarded/.env.local.production .
          mkdir -p data/tokens
          cp ~/secrets/dashboarded/tokens/* data/tokens/

      - name: Build and restart
        run: docker compose up -d --build

      - name: Show status
        run: docker compose ps
