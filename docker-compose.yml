# Images are built on the dev machine (cross-compiled for linux/arm64 - the Pi
# is too weak to build on-device) and shipped here via scp + docker load, not a
# registry pull. Run from the repo root on your dev machine:
#   .\scripts\deploy-to-pi.ps1
#
# This is the whole point of the Docker migration: replaces whatever manual
# venv + npm-run + systemd-unit setup exists today with one script.

services:
  app:
    image: ${DASHBOARD_IMAGE:-dashboard-next:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./.env.local.production
    volumes:
      - dashboard-tokens:/data/tokens
      - dashboard-sensor:/data/sensor:ro
      # CPU temp needs host access - read-only.
      - /sys/class/thermal:/sys/class/thermal:ro
      # Read-write for /api/settings/toggle-brightness (brightnessctl). Write
      # access relies on the backlight sysfs path being group-owned "video" on
      # the host with GID 44 (Debian's default, and Raspberry Pi OS's too) -
      # the Dockerfile adds the nextjs user to that same GID. If brightness
      # writes still fail with EACCES, check `stat -c '%G %g' /sys/class/backlight/*/brightness`
      # on the Pi and adjust the Dockerfile's video group if the GID differs.
      - /sys/class/backlight:/sys/class/backlight
    # /dev/vchiq (needed for vcgencmd's voltage reading) doesn't exist on
    # every Pi/OS combo - notably missing on Bookworm and on Pi 5, which uses
    # a different chip (RP1) than the legacy VideoCore mailbox interface this
    # belongs to. Not worth requiring: /api/vitals already handles vcgencmd
    # failing gracefully (falls back to 0), so this was speculative from the
    # initial migration and never actually needed. If your Pi does have
    # /dev/vchiq (check with `ls /dev/vchiq` on the host) and you want the
    # voltage reading, add back:
    #   devices:
    #     - /dev/vchiq
    #   volumes:
    #     - /opt/vc:/opt/vc:ro
    depends_on:
      - sensor-poller

  sensor-poller:
    image: ${SENSOR_POLLER_IMAGE:-dashboard-sensor-poller:latest}
    build:
      context: ./sensor_poller
      dockerfile: Dockerfile
    restart: unless-stopped
    privileged: true # simplest path to GPIO access; narrow to specific
    # /dev/gpiomem + /dev/mem device mounts once you've confirmed it works,
    # if you'd rather not run a container privileged long-term.
    environment:
      SENSOR_DATA_PATH: /data/sensor/latest.json
      SENSOR_POLL_INTERVAL: "10"
    volumes:
      - dashboard-sensor:/data/sensor

volumes:
  dashboard-tokens:
  dashboard-sensor:
